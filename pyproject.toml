[project]
name = "price-is-right"
version = "0.1.0"
description = "Autonomous multi-agent framework that hunts for online bargains."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "chromadb>=1.1.0",
    "datasets>=5.0.1",
    "feedparser>=6.0.12",
    "gradio>=5.47.2,<6.0",
    "litellm>=1.77.5",
    "modal>=1.1.4",
    "numpy>=2.3.3",
    "openai>=1.109.1",
    "pandas>=2.3.3",
    "plotly>=6.3.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "sentence-transformers>=5.1.1",
    "telethon>=1.45.0",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
]

# CUDA build of PyTorch on Windows and Linux (CUDA 13.0 supports RTX 50xx Blackwell GPUs).
# macOS has no CUDA wheels and keeps the default PyPI build.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
notebooks = [
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
]
training = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "peft>=0.21.2",
    "pyarrow>=25.0.1",
    "transformers>=5.16.1",
    "trl>=1.14.2",
]
